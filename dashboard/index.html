<!doctype html>
<!-- Token Radar: a static page, no framework and no network. data.js (written by main.ts)
     carries the board, the model constants and the live-token rows; app.js renders the board,
     the filters, the sort, the detail view, the model panel, the how-to-read guide and the
     model sandbox. The loading line is replaced by the board as soon as app.js runs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Token Radar: 226 pre-token protocols ranked by implied value, each with a launch readiness score, a top movers strip and an eight-step farm plan.">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true">
  <p class="loading">Loading the board…</p>
</main>
<noscript>
  <p>Token Radar needs JavaScript: the board, the filters and the detail view are all rendered in the page, with no network.</p>
</noscript>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
